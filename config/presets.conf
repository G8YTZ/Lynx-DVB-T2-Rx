# /etc/t2rx/presets.conf - receiver presets (1-9). freq in MHz.
# bw in kHz: 1350, 1700, 2000, or the full-width channels 5000, 6000, 7000, 8000.
# service = N picks one programme when a multiplex carries several (omit for the first).
# Everything except 1350 and 2000 works with the stock cxd2880 driver.
# After editing: sudo t2rx-ctl reload   (or restart: sudo systemctl restart t2rx)

[1]
name = 70cm T2 1.7
freq = 436.000
bw = 1700

[2]
name = 70cm T2 2.0
freq = 436.000
bw = 2000

[3]
name = 70cm T2 1.35
freq = 436.000
bw = 1350

#[4]
#name = 8 MHz channel
#freq = 437.000
#bw = 8000

# if_bw forces the tuner's IF filter: 3 = 1.7 MHz, 0 = 5/6, 1 = 7, 2 = 8 MHz.
# 2000 kHz normally uses the 5 MHz filter, which admits a lot of noise - measured
# 10 dB worse C/N than 1350 on the same path. if_bw = 3 clips the signal's edges
# instead; worth trying if 2000 is hard to lock.
#[5]
#name = 70cm T2 2.0 narrow filter
#freq = 436.000
#bw = 2000
#if_bw = 3
