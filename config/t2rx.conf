# /etc/t2rx/t2rx.conf - Lynx DVB-T2 Receiver settings
[receiver]
# ALSA device for HDMI sound, or none
audio = hdmi:CARD=vc4hdmi,DEV=0
# sound buffer in ms (picture is delayed to match). Raise if the sound breaks up.
audio_buffer_ms = 200
# audio level, 1.0 = as received. Below 1 leaves headroom for AAC peaks.
audio_volume = 0.8
# OSD on its own display plane (auto) - zero-copy video, lightest on a Pi Zero;
# off = blend it onto the video instead (the 1.1 method)
osd_plane = auto
# kms = plain (default). fix = correct the shape on monitors that report their size
# wrongly - only applies when the OSD is blended (osd_plane = off). On a television
# leave this on kms: fix makes the picture too wide, which shows as bars.
scale = kms
# HDMI output. "auto" (the default) lets the Pi and the display negotiate, as any
# other source would - on a 4K set that gives 1080p, since a Zero cannot drive 4K.
# Put a mode here (e.g. 1280x720@60) only to override a display that chooses badly.
# The receiver draws itself to whatever size results, so any resolution works.
hdmi = auto
# on-screen display: auto (full for osd_timeout s on lock/change, then mini), full, mini, off
osd = auto
osd_timeout = 15
# seconds between OSD redraws when a value changes
osd_interval = 2
# stream stored before playing starts (ms): rides over T2 bursts, the
# transmitter's audio/video mux offset and small clock differences
start_buffer_ms = 1500
# if a fast transmitter builds the store past this (ms), restart the player
max_buffer_ms = 8000
# software updates from GitHub: auto (check at boot and daily, install when idle),
# notify (show it on the status page; OK on the remote installs), off
updates = auto
# Restart the player if the picture stops for this many seconds while the signal
# is still locked - a frozen picture otherwise looks exactly like a good one.
# 0 turns the watchdog off.
stall_secs = 6
# H.264 decoding:
#   auto (default) - the Pi's hardware decoder, falling back to software if it
#                    refuses the stream (interlaced, or above level 4.0)
#   hw             - hardware only
#   sw             - software only. Needs a Pi 4 or 5 for HD; a Zero cannot.
decoder = auto
# deinterlace when decoding in software: auto (default) or off
deinterlace = auto
# control web page and webhooks on port web_port: on / off
web = on
web_port = 8080
# HDMI-CEC: use the TV remote, name shown on the TV, switch the TV to us at start-up
cec = yes
cec_name = Lynx DVB-T2 Rx
cec_active_source = yes
# seconds without lock before retuning
loss_seconds = 5
adapter = 0
