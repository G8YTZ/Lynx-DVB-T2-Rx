# /etc/t2rx/t2rx.conf - Lynx DVB-T2 Receiver settings
[receiver]
# ALSA device for HDMI sound, or none
audio = hdmi:CARD=vc4hdmi,DEV=0
# fix = correct picture shape even if the monitor reports its size wrongly; kms = plain
scale = fix
# on-screen display: auto (full for osd_timeout s on lock/change, then mini), full, mini, off
osd = auto
osd_timeout = 15
# HDMI-CEC: use the TV remote, name shown on the TV, switch the TV to us at start-up
cec = yes
cec_name = Lynx DVB-T2 Rx
cec_active_source = yes
# seconds without lock before retuning
loss_seconds = 5
adapter = 0
