# /etc/t2rx/t2rx.conf - Lynx DVB-T2 Receiver settings
[receiver]
# ALSA device for HDMI sound, or none
audio = hdmi:CARD=vc4hdmi,DEV=0
# sound buffer in ms (picture is delayed to match). Raise if the sound breaks up.
audio_buffer_ms = 200
# audio level, 1.0 = as received. Below 1 leaves headroom for AAC peaks.
audio_volume = 0.8
# OSD on its own display plane (auto) - zero-copy video, lightest on a Pi Zero;
# off = blend it onto the video instead (the 1.1 method)
osd_plane = auto
# kms = plain (default). fix = correct the shape on monitors that report their size
# wrongly - only applies when the OSD is blended (osd_plane = off)
scale = kms
# on-screen display: auto (full for osd_timeout s on lock/change, then mini), full, mini, off
osd = auto
osd_timeout = 15
# seconds between OSD redraws when a value changes
osd_interval = 2
# stream stored before playing starts (ms): rides over T2 bursts, the
# transmitter's audio/video mux offset and small clock differences
start_buffer_ms = 1500
# if a fast transmitter builds the store past this (ms), restart the player
max_buffer_ms = 8000
# HDMI-CEC: use the TV remote, name shown on the TV, switch the TV to us at start-up
cec = yes
cec_name = Lynx DVB-T2 Rx
cec_active_source = yes
# seconds without lock before retuning
loss_seconds = 5
adapter = 0
